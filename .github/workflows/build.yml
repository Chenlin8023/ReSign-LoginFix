name: build-deb

# 云端编译 ReSign 登录修复补丁（无需本地工具链）
# 触发：Actions → build-deb → Run workflow

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Theos
        uses: waruhachi/theos-action@v2.6.3
        with:
          theos-src: "waruhachi/theos"
          theos-branch: "main"
          sdks-src: "waruhachi/sdks"
          sdks-branch: "main"

      - name: Build rootless + rootful
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd theos

          # 先做 rootless（装到 /var/jb，越狱设备常用）
          make clean FINALPACKAGE=1 >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64 arm64e"
          cp -v packages/*.deb "$GITHUB_WORKSPACE/out/" 2>/dev/null || true

          # 再做 rootful
          make clean FINALPACKAGE=1 >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"
          cp -v packages/*.deb "$GITHUB_WORKSPACE/out/" 2>/dev/null || true

          ls -l "$GITHUB_WORKSPACE/out"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: resignpatch-deb
          path: out/*.deb
          if-no-files-found: error

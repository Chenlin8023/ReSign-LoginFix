name: build-linux

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 theos（Linux 版，自带工具链和 SDK）
        uses: Randomblock1/theos-action@main
        with:
          theos-dir: ${{ github.workspace }}/theos

      - name: 编译两种布局
        working-directory: tweak
        shell: bash
        run: |
          set -x
          mkdir -p "$GITHUB_WORKSPACE/out"
          make clean FINALPACKAGE=1 >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64 arm64e"
          cp -v packages/*.deb "$GITHUB_WORKSPACE/out/" || true
          make clean FINALPACKAGE=1 >/dev/null 2>&1 || true
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e"
          cp -v packages/*.deb "$GITHUB_WORKSPACE/out/" || true
          ls -l "$GITHUB_WORKSPACE/out"

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: resignpatch-debs
          path: out/*.deb
          if-no-files-found: error